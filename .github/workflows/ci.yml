name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

# CI runs only `-m "not live"` tests, so it stays out of the live-gmail-tests
# group: GitHub keeps one queued run per group, and CI runs (Dependabot opens
# many at once) would cancel a queued Deploy. A newer push supersedes older CI.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Ensure node is in system PATH
        run: |
          NODE_BIN=$(which node 2>/dev/null || true)
          if [ -n "$NODE_BIN" ] && [ ! -e /usr/local/bin/node ]; then
            sudo ln -sf "$NODE_BIN" /usr/local/bin/node
          fi

      - name: Start Postgres
        run: |
          sudo chmod 666 /var/run/docker.sock
          docker rm -f postgres 2>/dev/null || true
          docker run -d \
            --name postgres \
            --network host \
            -e POSTGRES_USER=claven \
            -e POSTGRES_PASSWORD=claven \
            -e POSTGRES_DB=claven_test \
            postgres:16
          until docker exec postgres pg_isready -U claven -q; do sleep 1; done

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      # Fails on any known vulnerability in the runtime dependencies (CASA M6).
      - name: Audit Python dependencies
        run: pip-audit -r requirements.txt

      - name: Run migrations
        env:
          DATABASE_URL: postgresql://claven:claven@localhost:5432/claven_test
        run: alembic upgrade head

      - name: Run tests
        env:
          PYTEST_DATABASE_URL: postgresql://claven:claven@localhost:5432/claven_test
        # No secrets: these tests set their own test values, and CI runs on every
        # branch. Prod credentials live in the production environment (deploy.yml).
        run: pytest --tb=short -m "not live"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: web

      # Fails on high or critical vulnerabilities in what ships (CASA M6);
      # build tools are devDependencies and aren't deployed.
      - name: Audit frontend dependencies
        run: npm audit --omit=dev --audit-level=high
        working-directory: web

      - name: Run frontend tests
        run: npm test
        working-directory: web
