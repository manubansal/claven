name: Neon usage

# Claven's Neon project is on the Free plan: it never bills, but it is
# suspended for the rest of the month if it uses up its compute or transfer.
# This checks the pace every six hours (the Neon API calls don't wake the
# database). A warning opens or updates a "Neon usage" issue; an alert also
# fails the run, which GitHub emails about.

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

concurrency:
  group: neon-usage
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      NEON_ORG_ID: org-dark-tree-04792539
      NEON_PROJECT_ID: shy-hall-60730130

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check usage against Free plan limits
        id: check
        # bash (not the default sh -e) adds pipefail, so the script's exit code survives tee.
        shell: bash
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: python scripts/neon_usage.py | tee report.md

      - name: Open or update the Neon usage issue
        if: always() && (steps.check.outputs.level == 'warn' || steps.check.outputs.level == 'alert')
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          echo "[Run]($RUN_URL)" >> report.md
          number=$(gh issue list --state open --search 'in:title "Neon usage"' --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file report.md
          else
            gh issue create --title "Neon usage" --body-file report.md
          fi
